[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent"
version = "0.1.0"
description = "MiniAgent — 轻量级多模型路由 Agent，基于 Ollama 本地模型 + DeepSeek 云端模型"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "NoahSSJ" },
]
keywords = ["agent", "llm", "ollama", "deepseek", "router"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai>=2.53",
    "httpx>=0.28",
    "loguru>=0.7",
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "pydantic>=2.13",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
]

[tool.setuptools]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]